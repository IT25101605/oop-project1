<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineDrop | Create New Dish</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-charcoal: #121212;
            --soft-gray: #f4f4f4;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfcfc;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .main-container {
            max-width: 1000px;
            margin: auto;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            display: flex;
        }

        /* LEFT SIDE: FORM */
        .form-section {
            padding: 60px;
            flex: 1;
        }

        .brand-logo {
            color: var(--primary-gold);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
            display: block;
            text-decoration: none;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .input-group-custom {
            margin-bottom: 20px;
        }

        .label-custom {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted-gray);
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            background-color: var(--soft-gray);
            transition: 0.3s;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--primary-gold);
            background-color: white;
        }

        .btn-submit {
            background: var(--dark-charcoal);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--primary-gold);
            transform: translateY(-2px);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #777;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 25px;
            justify-content: center;
        }

        .back-link:hover { color: var(--dark-charcoal); }

        /* RIGHT SIDE: IMAGE */
        .image-section {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .overlay-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .image-section { display: none; }
            .form-section { padding: 40px 30px; }
        }
    </style>
</head>

<body>

<div class="main-container">
    <!-- FORM COLUMN -->
    <div class="form-section">
        <a href="/dashboard" class="brand-logo">DINEDROP</a>

        <h1 class="form-title">Add New Dish</h1>
        <p class="text-muted small mb-4">Fill in the details to introduce a new signature item to the menu.</p>

        <form action="/foods/add" method="post">
            <div class="input-group-custom">
                <label class="label-custom">Dish Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Truffle Gnocchi" required>
            </div>

            <div class="row">
                <div class="col-6">
                    <div class="input-group-custom">
                        <label class="label-custom">Price ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                    </div>
                </div>
                <div class="col-6">
                    <div class="input-group-custom">
                        <label class="label-custom">Restaurant ID</label>
                        <input type="text" name="restaurantId" class="form-control" placeholder="RID-101" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Register Dish</button>
        </form>

        <a href="/foods/all" class="back-link">
            <span class="material-icons" style="font-size: 18px;">arrow_back</span>
            Return to Menu List
        </a>
    </div>

    <!-- VISUAL COLUMN -->
    <div class="image-section">
        <div class="overlay-text">
            <h3 class="fw-bold">Culinary Mastery</h3>
            <p class="opacity-75">Every great dish starts with a single entry.</p>
        </div>
    </div>
</div>

</body>
</html>
