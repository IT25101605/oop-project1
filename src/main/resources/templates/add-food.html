<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineDrop | Curate Your Menu</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-charcoal: #121212;
            --soft-bg: #fdfdfd;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .curator-container {
            width: 95%;
            max-width: 1100px;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            display: flex;
            margin: 20px;
        }

        /* VISUAL PANEL */
        .curator-visual {
            flex: 1;
            background: linear-gradient(rgba(18, 18, 18, 0.4), rgba(18, 18, 18, 0.4)),
            url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        /* FORM PANEL */
        .curator-form-section {
            flex: 1.2;
            padding: 60px;
            background: white;
        }

        .brand-tag {
            color: var(--primary-gold);
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--dark-charcoal);
            margin-bottom: 35px;
        }

        .input-group-custom {
            margin-bottom: 25px;
        }

        .label-custom {
            font-size: 0.7rem;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid #eee;
            background: var(--soft-bg);
            transition: all 0.3s;
            font-size: 0.95rem;
            color: var(--dark-charcoal);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
            background: white;
            outline: none;
        }

        .btn-submit {
            background: var(--dark-charcoal);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .back-nav {
            margin-top: 30px;
            text-align: center;
        }

        .link-secondary {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .link-secondary:hover {
            color: var(--dark-charcoal);
        }

        @media (max-width: 992px) {
            .curator-visual { display: none; }
            .curator-form-section { padding: 40px 30px; }
        }
    </style>
</head>

<body>

<div class="curator-container">

    <!-- VISUAL SIDE -->
    <div class="curator-visual">
        <div>
            <span class="material-icons" style="font-size: 40px; color: var(--primary-gold);"></span>
            <h3 class="mt-3 fw-bold">Define Your Menu.</h3>
            <p class="opacity-75">Every great meal starts with a perfect description. Showcase your culinary artistry to the world.</p>
        </div>
        <div class="small opacity-50">DineDrop Gourmet Network &copy; 2026</div>
    </div>

    <!-- FORM SIDE -->
    <div class="curator-form-section">
        <span class="brand-tag">Menu Management</span>
        <h2>Register New Dish</h2>

        <form action="/foods/add" method="post">

            <!-- FOOD NAME -->
            <div class="input-group-custom">
                <label class="label-custom">Dish Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Signature Truffle Pasta" required>
            </div>

            <!-- PRICE -->
            <div class="input-group-custom">
                <label class="label-custom">Price (USD)</label>
                <div class="position-relative">
                    <span class="position-absolute top-50 translate-middle-y ms-3 text-muted">$</span>
                    <input type="number" step="0.01" name="price" class="form-control ps-4" placeholder="0.00" required>
                </div>
            </div>

            <!-- RESTAURANT DROPDOWN -->
            <div class="input-group-custom">
                <label class="label-custom">Assign to Restaurant</label>
                <select name="restaurantId" class="form-select" required>
                    <option value="" selected disabled>Select an establishment</option>
                    <option th:each="restaurant : ${restaurants}"
                            th:value="${restaurant.id}"
                            th:text="${restaurant.name}">
                        Demo Restaurant
                    </option>
                </select>
            </div>

            <button type="submit" class="btn-submit">
                <span class="material-icons" style="font-size: 20px;"></span>
                Add to Menu
            </button>

        </form>

        <div class="back-nav">
            <a href="/foods/all" class="link-secondary">
                View Entire Menu Inventory
            </a>
        </div>
    </div>

</div>

</body>
</html>
