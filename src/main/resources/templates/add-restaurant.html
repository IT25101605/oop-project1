<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineDrop | Register Your Restaurant</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-charcoal: #121212;
            --soft-bg: #f4f7f6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--soft-bg);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .enrollment-container {
            width: 95%;
            max-width: 1000px;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            display: flex;
            margin: 20px;
        }

        /* VISUAL PANEL */
        .enrollment-visual {
            flex: 1;
            background: linear-gradient(rgba(18, 18, 18, 0.6), rgba(18, 18, 18, 0.6)),
            url('https://images.unsplash.com/photo-1550966842-28c258631508?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: white;
        }

        .visual-content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        /* FORM PANEL */
        .enrollment-form-section {
            flex: 1.2;
            padding: 60px;
            background: white;
        }

        .brand-tag {
            color: var(--primary-gold);
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--dark-charcoal);
            margin-bottom: 35px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group-custom .material-icons {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
            font-size: 20px;
        }

        .form-control {
            border-radius: 12px;
            padding: 14px 15px 14px 48px;
            border: 1px solid #eee;
            background: #fdfdfd;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
            background: white;
            outline: none;
        }

        .btn-add {
            background: var(--dark-charcoal);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-add:hover {
            background: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .nav-footer {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
        }

        .link-view {
            color: var(--dark-charcoal);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .link-view:hover {
            color: var(--primary-gold);
        }

        @media (max-width: 992px) {
            .enrollment-visual { display: none; }
            .enrollment-form-section { padding: 40px 30px; }
        }
    </style>
</head>

<body>

<div class="enrollment-container">

    <!-- LEFT VISUAL PANEL -->
    <div class="enrollment-visual">
        <div class="visual-content">
            <span class="material-icons" style="font-size: 40px; color: var(--primary-gold); margin-bottom: 20px;">stars</span>
            <h3>Expand Your Empire.</h3>
            <p class="opacity-75">Connect your culinary vision with thousands of hungry customers across the network.</p>
        </div>
    </div>

    <!-- RIGHT FORM PANEL -->
    <div class="enrollment-form-section">
        <span class="brand-tag">Establishment Setup</span>
        <h2>Add Restaurant</h2>

        <form action="/restaurant/add" method="post">

            <!-- Restaurant Name -->
            <label class="form-label">Restaurant Name</label>
            <div class="input-group-custom">
                <span class="material-icons">restaurant</span>
                <input type="text" name="name" class="form-control" placeholder="e.g. The Golden Bistro" required>
            </div>

            <!-- Location -->
            <label class="form-label">Physical Location</label>
            <div class="input-group-custom">
                <span class="material-icons">place</span>
                <input type="text" name="location" class="form-control" placeholder="e.g. Colombo 07" required>
            </div>

            <!-- Owner Email -->
            <label class="form-label">Administrative Email</label>
            <div class="input-group-custom">
                <span class="material-icons">mail_outline</span>
                <input type="email" name="ownerEmail" class="form-control" placeholder="owner@example.com" required>
            </div>

            <button type="submit" class="btn-add">
                <span class="material-icons" style="font-size: 20px;">add_circle_outline</span>
                Register Establishment
            </button>
        </form>

        <div class="nav-footer">
            <a href="/restaurant/all" class="link-view">
                <span class="material-icons" style="font-size: 18px;">list_alt</span>
                View All Restaurants
            </a>
        </div>
    </div>

</div>

</body>
</html>
