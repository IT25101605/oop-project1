<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineDrop | Admin Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-charcoal: #121212;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0');
            background-size: cover;
            background-position: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            color: var(--primary-gold);
            letter-spacing: 3px;
            font-size: 0.85rem;
            text-align: center;
            display: block;
            margin-bottom: 8px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--dark-charcoal);
            margin-bottom: 5px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper .material-icons {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        .form-control {
            padding: 12px 15px 12px 45px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            outline: none;
        }

        .btn-login {
            background: var(--dark-charcoal);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            margin-top: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .forgot-pw {
            display: block;
            text-align: right;
            font-size: 0.75rem;
            color: #888;
            text-decoration: none;
            margin-bottom: 20px;
            margin-top: -15px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="login-header">
        <span class="brand-logo">DINEDROP ADMIN</span>
        <h1>Admin Login</h1>
        <p class="text-muted small">Secure access to your dashboard.</p>
    </div>

    <form action="/admin/login" method="post">

        <!-- USERNAME -->
        <label class="form-label">Username</label>
        <div class="input-wrapper">
            <span class="material-icons">person</span>
            <input type="text" name="username" class="form-control" placeholder="admin@dinedrop.com" required>
        </div>

        <!-- PASSWORD -->
        <label class="form-label">Password</label>
        <div class="input-wrapper">
            <span class="material-icons">lock</span>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <a href="#" class="forgot-pw">Forgot password?</a>

        <button type="submit" class="btn-login">
            Login
            <span class="material-icons">login</span>
        </button>
    </form>
</div>

</body>
</html>
