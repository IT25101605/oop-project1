<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Admin Login - FoodieGo')}"></head>

<style>

    /* glass background */

    body{
        min-height:100vh;

        background:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)),
                url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600');

        background-size:cover;
        background-position:center;
        background-attachment:fixed;

        font-family:"SF Pro Display", sans-serif;

        color:white;

        text-shadow:0 1px 3px rgba(0,0,0,0.45);
    }

    /* Glow */

    body::before,
    body::after{
        content:'';
        position:fixed;
        width:320px;
        height:320px;
        border-radius:50%;
        filter:blur(100px);
        z-index:0;
    }

    body::before{
        background:#ff9966;
        top:-120px;
        left:-100px;
        opacity:0.45;
    }

    body::after{
        background:#6dd5fa;
        bottom:-120px;
        right:-100px;
        opacity:0.4;
    }

    /* Layer */

    .container{
        position:relative;
        z-index:2;
    }

    /* ===== AUTH CARD ===== */

    .auth-card{

        max-width:420px;

        margin:80px auto;

        padding:35px;

        background:rgba(20,20,20,0.35);

        backdrop-filter:blur(22px);
        -webkit-backdrop-filter:blur(22px);

        border:1px solid rgba(255,255,255,0.15);

        border-radius:32px;

        box-shadow:0 8px 32px rgba(0,0,0,0.3);

        color:white;
    }

    /* ===== IMPROVED TITLE VISIBILITY ===== */

    .auth-card h2{
        font-weight:800;
        font-size:30px;
        letter-spacing:0.6px;

        color:#ffffff;

        text-shadow:
                0 2px 10px rgba(0,0,0,0.7),
                0 0 25px rgba(255,255,255,0.25);
    }

    /* Titles */

    .auth-card h3{
        font-weight:700;
    }

    .text-muted{
        color:rgba(255,255,255,0.75) !important;
    }

    /* Inputs */

    .form-control{
        background:rgba(255,255,255,0.10) !important;

        border:1px solid rgba(255,255,255,0.15) !important;

        color:white !important;

        border-radius:14px;

        padding:12px;

        font-weight:500;
    }

    .form-control::placeholder{
        color:rgba(255,255,255,0.6);
    }

    .form-control:focus{
        box-shadow:none;
        border-color:rgba(255,255,255,0.35) !important;
    }

    /* Labels */

    label{
        font-weight:600;
        margin-bottom:6px;
        color:rgba(255,255,255,0.85);
    }

    /* Button */

    .btn-brand{
        background:rgba(255,255,255,0.18);

        border:1px solid rgba(255,255,255,0.18);

        color:white !important;

        font-weight:600;

        border-radius:16px;

        padding:12px;

        transition:0.3s;
    }

    .btn-brand:hover{
        background:rgba(255,255,255,0.28);
    }

    /* Alert */

    .alert{
        border:none;

        border-radius:18px;

        backdrop-filter:blur(15px);

        color:white;
    }

    .alert-danger{
        background:rgba(220,53,69,0.18);
    }

    /* Footer text */

    .small{
        color:rgba(255,255,255,0.7);
    }

    /* Center alignment tweaks */

    .text-center{
        text-align:center;
    }

    /* Responsive */

    @media(max-width:768px){
        .auth-card{
            margin:40px 15px;
            padding:25px;
        }
    }

</style>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <div class="auth-card">

        <!-- IMPROVED TITLE -->
        <h2 class="text-center mb-1">
            🔐 Admin Login
        </h2>

        <p class="text-center text-muted">
            Restricted area
        </p>

        <!-- Error -->

        <div class="alert alert-danger"
             th:if="${error}"
             th:text="${error}">
        </div>

        <!-- Form -->

        <form method="post"
              th:action="@{/admin-login}">

            <div class="mb-3">

                <label>Admin Email</label>

                <input class="form-control"
                       type="email"
                       name="email"
                       value="admin@foodiego.com"
                       required>

            </div>

            <div class="mb-3">

                <label>Password</label>

                <input class="form-control"
                       type="password"
                       name="password"
                       required>

            </div>

            <button class="btn btn-brand w-100">
                Login as Admin
            </button>

        </form>

        <p class="text-center mt-3 small text-muted">



        </p>

    </div>

</div>

<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineDrop | Admin Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-charcoal: #121212;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0');
            background-size: cover;
            background-position: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            color: var(--primary-gold);
            letter-spacing: 3px;
            font-size: 0.85rem;
            text-align: center;
            display: block;
            margin-bottom: 8px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--dark-charcoal);
            margin-bottom: 5px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper .material-icons {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        .form-control {
            padding: 12px 15px 12px 45px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            outline: none;
        }

        .btn-login {
            background: var(--dark-charcoal);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            margin-top: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .forgot-pw {
            display: block;
            text-align: right;
            font-size: 0.75rem;
            color: #888;
            text-decoration: none;
            margin-bottom: 20px;
            margin-top: -15px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="login-header">
        <span class="brand-logo">DINEDROP ADMIN</span>
        <h1>Admin Login</h1>
        <p class="text-muted small">Secure access to your dashboard.</p>
    </div>

    <form action="/admin/login" method="post">

        <!-- USERNAME -->
        <label class="form-label">Username</label>
        <div class="input-wrapper">
            <span class="material-icons"></span>
            <input type="text" name="username" class="form-control" placeholder="admin@dinedrop.com" required>
        </div>

        <!-- PASSWORD -->
        <label class="form-label">Password</label>
        <div class="input-wrapper">
            <span class="material-icons"></span>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <a href="#" class="forgot-pw">Forgot password?</a>

        <button type="submit" class="btn-login">
            Login
            <span class="material-icons"></span>
        </button>
    </form>
</div>

</body>
</html>
