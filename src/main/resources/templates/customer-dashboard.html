<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="dashboard-box">
    <h1>Welcome, <span th:text="${customerName}"></span></h1>
    <p>Customer Dashboard</p>

    <div class="btn-group">
        <a th:href="@{/customer/profile}" class="btn">Update Profile</a>
        <a th:href="@{/customer/logout}" class="btn logout-btn">Logout</a>
    </div>
</div>
</body>
</html>
