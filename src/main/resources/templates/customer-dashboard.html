<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Welcome, <span th:text="${userName}"></span></h2>

    <div class="row mt-4">

        <div class="col-md-3">
            <a href="/restaurants" class="btn btn-primary w-100">Browse Restaurants</a>
        </div>

        <div class="col-md-3">
            <a href="/foods" class="btn btn-success w-100">View Foods</a>
        </div>

        <div class="col-md-3">
            <a href="/cart" class="btn btn-warning w-100">My Cart</a>
        </div>

        <div class="col-md-3">
            <a href="/orders" class="btn btn-info w-100">My Orders</a>
        </div>

    </div>

    <div class="mt-4">
        <a href="/customer/profile" class="btn btn-dark">My Profile</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</div>

</body>
</html>
