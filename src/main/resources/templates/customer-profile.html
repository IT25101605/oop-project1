<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineDrop | My Profile</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-charcoal: #1a1a1a;
            --danger-red: #dc3545;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--dark-charcoal);
            padding-bottom: 50px;
        }

        .profile-header {
            background: var(--dark-charcoal);
            color: white;
            padding: 80px 0;
            margin-bottom: -50px;
            text-align: center;
        }

        .profile-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            border: none;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            background: var(--primary-gold);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-family: 'Playfair Display', serif;
            margin: 0 auto 20px;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-top: 15px;
        }

        .form-control {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-control[readonly] {
            background-color: #f1f1f1;
            cursor: not-allowed;
            color: #777;
        }

        .btn-update {
            background: var(--dark-charcoal);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: var(--primary-gold);
            transform: translateY(-2px);
        }

        /* DANGER ZONE */
        .danger-zone {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px dashed #ddd;
        }

        .btn-delete {
            background: none;
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: white;
        }
    </style>
</head>

<body>

<div class="profile-header">
    <div class="container">
        <h2>Account Settings</h2>
        <p class="opacity-75">Manage your personal preferences and security</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="profile-card">

                <!-- AVATAR PLACEHOLDER -->
                <div class="avatar-circle">
                    <span th:text="${#strings.substring(customer.name,0,1)}">U</span>
                </div>

                <form method="post" action="/customer/update">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input class="form-control" name="name" th:value="${customer.name}" placeholder="Your Name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address (Fixed)</label>
                            <input class="form-control" name="email" th:value="${customer.email}" readonly>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Security Password</label>
                            <input class="form-control" type="password" name="password" th:value="${customer.password}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input class="form-control" name="phone" th:value="${customer.phone}" placeholder="Contact Number">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Primary Delivery Address</label>
                        <input class="form-control" name="address" th:value="${customer.address}" placeholder="Street, City, State">
                    </div>

                    <div class="mt-4 text-end">
                        <button class="btn btn-update">Save Changes</button>
                    </div>
                </form>

                <!-- DANGER ZONE -->
                <div class="danger-zone">
                    <h5 class="text-muted mb-3" style="font-size: 0.9rem; font-weight: 700; text-transform: uppercase;">Danger Zone</h5>
                    <div class="d-flex justify-content-between align-items-center">
                        <p class="small text-muted mb-0">Once you delete your account, all data will be permanently removed.</p>
                        <form method="post" action="/customer/delete">
                            <button class="btn btn-delete">Delete Account</button>
                        </form>
                    </div>
                </div>

            </div>

            <div class="text-center mt-4">
                <a href="/dashboard" class="text-muted text-decoration-none small">← Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
