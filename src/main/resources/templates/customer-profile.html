<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>My Profile</h2>

    <form method="post" action="/customer/update">
        <input class="form-control mb-2" name="name" th:value="${customer.name}">
        <input class="form-control mb-2" name="email" th:value="${customer.email}" readonly>
        <input class="form-control mb-2" name="password" th:value="${customer.password}">
        <input class="form-control mb-2" name="address" th:value="${customer.address}">
        <input class="form-control mb-2" name="phone" th:value="${customer.phone}">

        <button class="btn btn-success">Update</button>
    </form>

    <form method="post" action="/customer/delete" class="mt-3">
        <button class="btn btn-danger">Delete Account</button>
    </form>

</div>

</body>
</html>
