<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineDrop | Edit Dish</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

  <style>
    :root {
      --primary-gold: #D4AF37;
      --dark-charcoal: #121212;
      --soft-gray: #f8f9fa;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
      url('https://images.unsplash.com/photo-1495195129352-aeb325a55b65?auto=format&fit=crop&q=80&w=2000');
      background-size: cover;
    }

    .edit-container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,0.15);
      display: flex;
    }

    /* LEFT SIDE: DECORATIVE */
    .edit-visual {
      flex: 1;
      background: url('https://images.unsplash.com/photo-1619714604987-2f6caead7850?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 40px;
      color: white;
      position: relative;
    }

    .edit-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    .visual-text {
      position: relative;
      z-index: 2;
    }

    /* RIGHT SIDE: FORM */
    .edit-form-section {
      flex: 1.2;
      padding: 50px;
      background: white;
    }

    .edit-header {
      margin-bottom: 30px;
    }

    .edit-header h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--dark-charcoal);
    }

    .dish-id-badge {
      font-size: 0.7rem;
      background: var(--soft-gray);
      padding: 4px 12px;
      border-radius: 50px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 8px;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .btn-update {
      background: var(--dark-charcoal);
      color: white;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      border: none;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-update:hover {
      background: var(--primary-gold);
      transform: translateY(-2px);
    }

    .footer-links {
      margin-top: 25px;
      text-align: center;
    }

    .back-btn {
      text-decoration: none;
      color: #888;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .back-btn:hover { color: var(--dark-charcoal); }

    @media (max-width: 768px) {
      .edit-visual { display: none; }
    }
  </style>
</head>

<body>

<div class="edit-container">
  <!-- VISUAL ASPECT -->
  <div class="edit-visual">
    <div class="visual-text">
      <span class="dish-id-badge bg-warning text-dark mb-2">Live Editor</span>
      <h3 class="fw-bold">Refining the Menu</h3>
      <p class="small opacity-75">Update ingredients, pricing, or details to keep your gourmet offerings current.</p>
    </div>
  </div>

  <!-- FORM ASPECT -->
  <div class="edit-form-section">
    <div class="edit-header">
      <span class="dish-id-badge">ID: [[${food.id}]]</span>
      <h2 class="mt-2">Edit Dish</h2>
    </div>

    <form action="/foods/update" method="post">
      <!-- HIDDEN ID FIELD -->
      <input type="hidden" name="id" th:value="${food.id}">

      <div class="mb-3">
        <label class="form-label">Dish Name</label>
        <input type="text" name="name" th:value="${food.name}" class="form-control" required>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Price ($)</label>
          <input type="number" step="0.01" name="price" th:value="${food.price}" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Restaurant ID</label>
          <input type="text" name="restaurantId" th:value="${food.restaurantId}" class="form-control" required>
        </div>
      </div>

      <button type="submit" class="btn-update">
        <span class="material-icons" style="font-size: 20px;"></span>
        Update Changes
      </button>
    </form>

    <div class="footer-links">
      <a href="/foods/all" class="back-btn d-inline-flex align-items-center">
        <span class="material-icons me-1" style="font-size: 18px;"></span>
        Discard & Go Back
      </a>
    </div>
  </div>
</div>

</body>
</html>
