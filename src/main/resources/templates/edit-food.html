<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Food</title>
</head>
<body>

<h1>Edit Food</h1>

<form action="/foods/update" method="post">

  <input type="hidden" name="id" th:value="${food.id}">

  <label>Name:</label>
  <input type="text" name="name" th:value="${food.name}" required><br><br>

  <label>Price:</label>
  <input type="number" step="0.01" name="price" th:value="${food.price}" required><br><br>

  <label>Restaurant ID:</label>
  <input type="text" name="restaurantId" th:value="${food.restaurantId}" required><br><br>

  <button type="submit">Update Food</button>
</form>

<br>
<a href="/foods/all">Back to List</a>

</body>
</html>
