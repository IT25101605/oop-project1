<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineDrop | Welcome Back</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-gold: #D4AF37;
      --dark-charcoal: #1a1a1a;
      --soft-white: #f8f9fa;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--soft-white);
      overflow: hidden; /* Prevents scroll on split screen */
    }

    .login-wrapper {
      display: flex;
      height: 100vh;
    }

    /* LEFT SIDE - IMMERSIVE ART */
    .login-left {
      flex: 1.2;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
      url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 60px;
    }

    .brand-text {
      color: white;
      z-index: 2;
      animation: fadeInUp 0.8s ease-out;
    }

    .brand-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin-bottom: 0;
    }

    .brand-text p {
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* RIGHT SIDE - FORM */
    .login-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 40px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease-in;
    }

    .welcome-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--dark-charcoal);
      margin-bottom: 8px;
    }

    .welcome-header p {
      color: #888;
      margin-bottom: 40px;
    }

    /* ARTISTIC FORM STYLING */
    .form-control {
      border: none;
      border-bottom: 2px solid #eee;
      border-radius: 0;
      padding: 12px 5px;
      box-shadow: none !important;
      transition: border-color 0.3s ease;
      font-size: 0.95rem;
    }

    .form-control:focus {
      border-bottom-color: var(--primary-gold);
    }

    .btn-custom {
      background: var(--dark-charcoal);
      color: white;
      border-radius: 5px;
      padding: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      margin-top: 20px;
      border: none;
    }

    .btn-custom:hover {
      background: var(--primary-gold);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
    }

    .link-register {
      text-decoration: none;
      color: var(--primary-gold);
      font-weight: 600;
    }

    .link-register:hover {
      text-decoration: underline;
    }

    /* RESPONSIVE */
    @media (max-width: 992px) {
      .login-left { display: none; }
      .login-right { flex: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <!-- LEFT SIDE -->
  <div class="login-left">
    <div class="brand-text">
      <h1>DineDrop</h1>
      <p>The Art of Fine Delivery</p>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="login-right">
    <div class="login-card">

      <div class="welcome-header">
        <h3>Welcome Back</h3>
        <p>Please enter your details to continue.</p>
      </div>

      <form method="post" action="/login">
        <div class="mb-4">
          <label class="small fw-bold text-uppercase text-muted">Email Address</label>
          <input class="form-control" type="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="mb-4">
          <label class="small fw-bold text-uppercase text-muted">Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small text-muted" for="remember">Remember me</label>
          </div>
          <a href="#" class="small text-muted text-decoration-none">Forgot Password?</a>
        </div>

        <button class="btn btn-custom w-100">Sign In</button>
      </form>

      <p class="mt-5 text-center small text-muted">
        New to DineDrop?
        <a class="link-register" href="/register">Create an account</a>
      </p>

    </div>
  </div>

</div>

</body>
</html>
