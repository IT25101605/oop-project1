<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>DineDrop - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
    }

    .login-wrapper {
      display: flex;
      height: 100vh;
    }

    /* LEFT SIDE IMAGE */
    .login-left {
      flex: 1;
      background: url('/images/hero-food.png');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .brand-text {
      position: absolute;
      color: white;
      bottom: 50px;
      left: 40px;
    }

    .brand-text h1 {
      font-size: 48px;
      font-weight: bold;
    }

    /* RIGHT SIDE FORM */
    .login-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .btn-custom {
      background: #111;
      color: white;
      border-radius: 25px;
      padding: 10px;
    }

    .btn-custom:hover {
      background: #333;
    }

    .link {
      text-decoration: none;
      color: #111;
      font-weight: 500;
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <!-- LEFT SIDE -->
  <div class="login-left">
    <div class="overlay"></div>
    <div class="brand-text">
      <h1>DineDrop</h1>
      <p>Fast. Fresh. Delivered.</p>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="login-right">

    <div class="login-card">

      <h3 class="mb-4 text-center">Welcome Back 👋</h3>

      <form method="post" action="/login">

        <div class="mb-3">
          <input class="form-control" type="email" name="email" placeholder="Email" required>
        </div>

        <div class="mb-3">
          <input class="form-control" type="password" name="password" placeholder="Password" required>
        </div>

        <button class="btn btn-custom w-100">Login</button>
      </form>

      <p class="mt-3 text-center">
        Don't have an account?
        <a class="link" href="/register">Register</a>
      </p>

    </div>

  </div>

</div>

</body>
</html>
