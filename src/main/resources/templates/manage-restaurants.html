<!DOCTYPE html>
1<html xmlns="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Manage Restaurants - FoodieGo')}"></head>

<style>
    body{
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.75)),
        url('https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=1600');
        background-size: cover;
        background-attachment: fixed;
        color: white;
    }

    .glass-card{
        background: rgba(20,20,20,0.35);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        overflow: hidden;
    }

    .glass-table{
        width:100%;
        color:white;
    }

    .glass-table thead{
        background: rgba(255,255,255,0.08);
    }

    .glass-table tbody tr{
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .glass-table td,
    .glass-table th{
        padding:14px;
        vertical-align: middle;
    }

    .btn-outline-danger{
        border-color: rgba(255,255,255,0.3);
        color:white;
    }

    .btn-outline-danger:hover{
        background: rgba(255,0,0,0.25);
    }

    /* subtle badge style for owner */
    .owner-badge{
        padding:4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        display: inline-block;
    }

</style>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-5">

    <h2 class="mb-4">All Restaurants</h2>

    <div class="glass-card">

        <table class="glass-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
                <th>Cuisine</th>
                <th>Owner</th>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Restaurants</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #d4af37;
            --danger: #ef4444;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height:100vh;
            padding:40px 20px;

            background:
                    linear-gradient(rgba(15,23,42,0.78),
                    rgba(15,23,42,0.78)),
                    url('https://images.unsplash.com/photo-1552566626-52f8b828add9?q=80&w=1600&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .container{
            max-width:1100px;
            margin:auto;
        }

        .header{
            text-align:center;
            margin-bottom:35px;
        }

        .badge{
            display:inline-block;
            background:rgba(212,175,55,0.15);
            border:1px solid rgba(212,175,55,0.4);
            color:#fcd34d;
            padding:8px 16px;
            border-radius:30px;
            font-size:13px;
            margin-bottom:15px;
            backdrop-filter: blur(8px);
        }

        .header h2{
            font-size:3rem;
            font-weight:700;
            margin-bottom:10px;
        }

        .header p{
            color:#d1d5db;
            font-size:15px;
        }

        .table-card{
            background:rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:25px;
            overflow:hidden;

            box-shadow:0 10px 40px rgba(0,0,0,0.3);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        thead{
            background:rgba(0,0,0,0.25);
        }

        th{
            padding:22px;
            font-size:14px;
            letter-spacing:1px;
            text-transform:uppercase;
            color:#f8fafc;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        td{
            padding:20px;
            font-size:15px;
            color:white;
        }

        td:first-child,
        th:first-child{
            width:75%;
            border-right:1px solid rgba(255,255,255,0.12);
        }

        tbody tr{
            transition:0.3s ease;
        }

        tbody tr:hover{
            background:rgba(255,255,255,0.08);
        }

        tbody tr:not(:last-child) td{
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .action-box{
            display:flex;
            justify-content:center;
        }

        .btn-delete{
            text-decoration:none;
            background:linear-gradient(135deg,#ef4444,#dc2626);
            color:white;
            padding:10px 18px;
            border-radius:12px;
            font-size:13px;
            font-weight:600;
            transition:0.3s ease;
            box-shadow:0 6px 16px rgba(239,68,68,0.35);
        }

        .btn-delete:hover{
            transform:translateY(-2px) scale(1.03);
            box-shadow:0 10px 22px rgba(239,68,68,0.45);
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="badge">Admin Dashboard</div>
        <h2>Manage Restaurants</h2>
        <p>Manage restaurant information and remove entries</p>
    </div>

    <div class="table-card">

        <table>

            <thead>
            <tr>
                <th>Restaurant Data</th>

                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="r : ${restaurants}">


                <td th:text="${r.id}"></td>

                <td th:text="${r.name}"></td>

                <td th:text="${r.city}"></td>

                <td th:text="${r.cuisine}"></td>

                <td>
                    <span class="owner-badge" th:text="${r.ownerId}"></span>
                </td>

                <td>
                    <form method="post"
                          th:action="@{'/admin/restaurants/delete/' + ${r.id}}"
                          data-confirm="Delete restaurant?">

                        <button class="btn btn-sm btn-outline-danger">
                            Delete
                        </button>

                    </form>

                <td th:text="${r}"></td>

                <td>
                    <div class="action-box">
                        <a th:href="@{'/admin/delete-restaurant?id=' + ${r.split(',')[0]}}"
                           class="btn-delete">
                            🗑 Delete
                        </a>
                    </div>

                </td>

            </tr>


            <tr th:if="${#lists.isEmpty(restaurants)}">
                <td colspan="6" class="text-center py-4" style="opacity:0.7;">
                    No restaurants found
                </td>
            </tr>



            </tbody>

        </table>

    </div>

</div>


<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>



</body>
</html>
