<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #d4af37;
            --danger: #ef4444;
            --white: #ffffff;
            --glass: rgba(255,255,255,0.12);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height:100vh;
            padding:40px 20px;

            /* Background Image */
            background:
                    linear-gradient(rgba(15,23,42,0.75),
                    rgba(15,23,42,0.75)),
                    url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=1600&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .container{
            max-width:1100px;
            margin:auto;
        }

        .header{
            text-align:center;
            margin-bottom:35px;
        }

        .badge{
            display:inline-block;
            background:rgba(212,175,55,0.15);
            border:1px solid rgba(212,175,55,0.4);
            color:#fcd34d;
            padding:8px 16px;
            border-radius:30px;
            font-size:13px;
            margin-bottom:15px;
            backdrop-filter: blur(8px);
        }

        .header h2{
            font-size:3rem;
            font-weight:700;
            margin-bottom:10px;
        }

        .header p{
            color:#d1d5db;
            font-size:15px;
        }

        .table-card{
            background:rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:25px;
            overflow:hidden;

            box-shadow:
                    0 10px 40px rgba(0,0,0,0.3);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        thead{
            background:rgba(0,0,0,0.25);
        }

        th{
            padding:22px;
            font-size:14px;
            letter-spacing:1px;
            text-transform:uppercase;
            color:#f8fafc;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        td{
            padding:20px;
            font-size:15px;
            color:white;
        }

        /* Separate columns visually */
        td:first-child,
        th:first-child{
            width:75%;
            border-right:1px solid rgba(255,255,255,0.12);
        }

        tbody tr{
            transition:0.3s ease;
        }

        tbody tr:hover{
            background:rgba(255,255,255,0.08);
        }

        tbody tr:not(:last-child) td{
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .user-email{
            font-weight:500;
            letter-spacing:0.3px;
        }

        .action-box{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .btn-delete{
            text-decoration:none;
            background:linear-gradient(135deg,#ef4444,#dc2626);
            color:white;
            padding:10px 18px;
            border-radius:12px;
            font-size:13px;
            font-weight:600;

            transition:0.3s ease;

            box-shadow:
                    0 6px 16px rgba(239,68,68,0.35);
        }

        .btn-delete:hover{
            transform:translateY(-2px) scale(1.03);
            box-shadow:
                    0 10px 22px rgba(239,68,68,0.45);
        }

        .footer{
            text-align:center;
            margin-top:18px;
            color:#cbd5e1;
            font-size:13px;
        }

        @media(max-width:768px){

            .header h2{
                font-size:2rem;
            }

            th, td{
                padding:14px;
                font-size:13px;
            }

            .btn-delete{
                padding:8px 12px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="badge">Admin Dashboard</div>
        <h2>Manage Users</h2>
        <p>Manage all registered users securely and efficiently</p>
    </div>

    <div class="table-card">

        <table>

            <thead>
            <tr>
                <th>User Data</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="u : ${users}">

                <td class="user-email"
                    th:text="${u}">
                </td>

                <td>
                    <div class="action-box">
                        <a th:href="@{'/admin/delete-user?email=' + ${u}}"
                           class="btn-delete">
                            🗑 Delete
                        </a>
                    </div>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <div class="footer">
        Secure User Management Panel
    </div>

</div>

</body>
</html>
