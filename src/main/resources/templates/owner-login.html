<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Owner Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-box">
    <h2>Restaurant Owner Login</h2>

    <p class="success-msg" th:if="${param.registered}">Registration successful. Please login.</p>
    <p class="error-msg" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/owner/login}" method="post">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <p><a th:href="@{/owner/register}">Create owner account</a></p>
    <p><a th:href="@{/}">Back to Home</a></p>
</div>
</body>
</html>
