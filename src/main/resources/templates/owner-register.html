<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Owner Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-box">
    <h2>Restaurant Owner Registration</h2>

    <p class="error-msg" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/owner/register}" method="post">
        <label>Owner Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Restaurant Name</label>
        <input type="text" name="restaurantName" required>

        <label>Phone</label>
        <input type="text" name="phone" required>

        <button type="submit" class="btn">Register</button>
    </form>

    <p><a th:href="@{/owner/login}">Already have an owner account?</a></p>
    <p><a th:href="@{/}">Back to Home</a></p>
</div>
</body>
</html>
