<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineDrop | Join the Community</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

  <style>
    :root {
      --primary-gold: #D4AF37;
      --dark-charcoal: #121212;
      --soft-gray: #f8f9fa;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--soft-gray);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .registration-container {
      width: 100%;
      max-width: 1100px;
      background: white;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.12);
      display: flex;
      margin: 20px;
    }

    /* VISUAL SECTION */
    .reg-visual {
      flex: 1;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
      url('https://images.unsplash.com/photo-1555244162-803834f70033?auto=format&fit=crop&q=80&w=1000');
      background-size: cover;
      background-position: center;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: white;
    }

    /* FORM SECTION */
    .reg-form-section {
      flex: 1.2;
      padding: 60px;
      background: white;
    }

    .brand-logo {
      color: var(--primary-gold);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: block;
    }

    .reg-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--dark-charcoal);
      margin-bottom: 10px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-control, .form-select {
      border-radius: 12px;
      padding: 12px 15px;
      border: 1px solid #eee;
      background: #fdfdfd;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .form-control:focus, .form-select:focus {
      background: white;
      border-color: var(--primary-gold);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
      outline: none;
    }

    .btn-register {
      background: var(--dark-charcoal);
      color: white;
      border: none;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-weight: 600;
      margin-top: 25px;
      transition: 0.3s;
    }

    .btn-register:hover {
      background: var(--primary-gold);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
    }

    .error-box {
      background: #fff5f5;
      color: #d9534f;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      border-left: 4px solid #d9534f;
      margin-bottom: 20px;
    }

    .login-link {
      color: var(--dark-charcoal);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid var(--primary-gold);
    }

    @media (max-width: 992px) {
      .reg-visual { display: none; }
      .reg-form-section { padding: 40px 30px; }
    }
  </style>
</head>

<body>

<div class="registration-container">

  <!-- VISUAL SIDE -->
  <div class="reg-visual">
    <h3 class="fw-bold">Taste the Excellence.</h3>
    <p class="opacity-75">Join thousands of food enthusiasts and top-tier restaurant owners today.</p>
  </div>

  <!-- FORM SIDE -->
  <div class="reg-form-section">
    <span class="brand-logo">DINEDROP</span>

    <div class="reg-header mb-4">
      <h2>Create Account</h2>
      <p class="text-muted small">Please provide your details to get started.</p>
    </div>

    <!-- ERROR MESSAGE (Maintained from your code) -->
    <div class="error-box text-center" th:if="${error}">
      <span th:text="${error}">Error Message Here</span>
    </div>

    <form action="/register" method="post">
      <div class="row">
        <!-- Name -->
        <div class="col-md-12 mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="name" placeholder="John Doe" required>
        </div>

        <!-- Email -->
        <div class="col-md-12 mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="john@example.com" required>
        </div>

        <!-- Password -->
        <div class="col-md-12 mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" placeholder="••••••••" required>
        </div>

        <!-- Address -->
        <div class="col-md-12 mb-3">
          <label class="form-label">Delivery Address</label>
          <input type="text" class="form-control" name="address" placeholder="123 Street, City" required>
        </div>

        <!-- Phone -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text" class="form-control" name="phone" placeholder="+123456789" required>
        </div>

        <!-- Role -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Register As</label>
          <select class="form-select" name="role" required>
            <option value="CUSTOMER">Customer</option>
            <option value="OWNER">Restaurant Owner</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-register">
        Create My Account
      </button>
    </form>

    <p class="text-center mt-4 text-muted small">
      Already have an account? <a href="/login" class="login-link">Sign In</a>
    </p>
  </div>

</div>

</body>
</html>
