<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineDrop | Menu Management</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/icon?family=Material+Icons">

  <style>
    :root {
      --primary-gold: #D4AF37;
      --dark-charcoal: #1a1a1a;
      --bg-canvas: #f8f9fa;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--dark-charcoal);
    }

    /* HEADER SECTION */
    .page-header {
      background: white;
      padding: 40px 0;
      border-bottom: 1px solid #eee;
      margin-bottom: 40px;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin: 0;
    }

    /* BUTTONS */
    .btn-action-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-add {
      background: var(--dark-charcoal);
      color: white;
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-add:hover {
      background: var(--primary-gold);
      color: white;
      transform: translateY(-2px);
    }

    /* NEW BACK BUTTON STYLE */
    .btn-back {
      border: 1.5px solid #eee;
      background: white;
      color: var(--dark-charcoal);
      border-radius: 12px;
      padding: 11px 20px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover {
      background: #f8f9fa;
      border-color: var(--dark-charcoal);
      color: var(--dark-charcoal);
    }

    /* FOOD CARDS */
    .food-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      height: 100%;
    }

    .food-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    }

    .food-img-wrapper {
      height: 200px;
      overflow: hidden;
      position: relative;
    }

    .food-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .price-tag {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.9);
      padding: 5px 15px;
      border-radius: 50px;
      font-weight: 700;
      color: var(--dark-charcoal);
      backdrop-filter: blur(5px);
    }

    .card-content {
      padding: 20px;
    }

    .restaurant-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-gold);
      font-weight: 700;
      margin-bottom: 5px;
      display: block;
    }

    .food-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    /* ACTION BUTTONS */
    .action-group {
      border-top: 1px solid #f0f0f0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      background: #fafafa;
    }

    .action-link {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .link-edit { color: var(--dark-charcoal); }
    .link-delete { color: #dc3545; }

    .action-link:hover { opacity: 0.7; }

  </style>
</head>

<body>

<!-- TOP NAVIGATION & HEADER -->
<header class="page-header">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h1 class="page-title">DineDrop</h1>
      <p class="text-muted mb-0"></p>
    </div>
    <div class="btn-action-group">
      <!-- ADDED BACK BUTTON -->
      <a href="/owner/dashboard" class="btn-back">
        <span class="material-icons" style="font-size: 20px;"></span>
        Back
      </a>
      <a href="/foods/add" class="btn-add">
        <span class="material-icons"></span>
        Add New Dish
      </a>
    </div>
  </div>
</header>

<div class="container mb-5">
  <div class="row g-4">

    <!-- FOOD ITEM ITERATION -->
    <div class="col-lg-4 col-md-6" th:each="food : ${foods}">
      <div class="food-card">
        <div class="food-img-wrapper">
          <!-- Dynamic Unsplash image based on food name for variety -->
          <img th:src="'https://images.unsplash.com/photo-1646606617272-70f5514b1054?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' + ${food.name} + ',food'"
               class="food-img" alt="Food Image">
          <div class="price-tag">
            $<span th:text="${food.price}">0.00</span>
          </div>
        </div>

        <div class="card-content">
          <span class="restaurant-badge">
              Restaurant ID: <span th:text="${food.restaurantId}">0</span>
          </span>
          <h3 class="food-name" th:text="${food.name}">Dish Name</h3>
          <p class="text-muted small">Dish ID: <span th:text="${food.id}">0</span></p>
        </div>

        <div class="action-group">
          <a th:href="@{/foods/edit/{id}(id=${food.id})}" class="action-link link-edit">
            <span class="material-icons" style="font-size: 18px;"></span> Edit
          </a>
          <a th:href="@{/foods/delete/{id}(id=${food.id})}" class="action-link link-delete">
            <span class="material-icons" style="font-size: 18px;"></span> Delete
          </a>
        </div>
      </div>
    </div>

    <!-- EMPTY STATE (If no foods exist) -->
    <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(foods)}">
      <span class="material-icons text-muted" style="font-size: 4rem;">restaurant_menu</span>
      <p class="mt-3 text-muted">Your menu is currently empty. Start by adding a new dish!</p>
    </div>

  </div>
</div>

</body>
</html>
