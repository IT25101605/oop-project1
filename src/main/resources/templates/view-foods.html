<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>View Foods</title>
</head>
<body>

<h1>Food List</h1>

<a href="/foods/add">Add New Food</a>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
    <th>Restaurant ID</th>
    <th>Actions</th>
  </tr>

  <tr th:each="food : ${foods}">
    <td th:text="${food.id}"></td>
    <td th:text="${food.name}"></td>
    <td th:text="${food.price}"></td>
    <td th:text="${food.restaurantId}"></td>
    <td>
      <a th:href="@{/foods/edit/{id}(id=${food.id})}">Edit</a> |
      <a th:href="@{/foods/delete/{id}(id=${food.id})}">Delete</a>
    </td>
  </tr>
</table>

</body>
</html>
